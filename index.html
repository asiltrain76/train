<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-content: center;
        }
        .quiz-container {
            background-color: #ffffff;
            width: 100%;

            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 25px;
            box-sizing: border-box;
        }
        /* كلاسات التحكم في إخفاء وإظهار الشاشات بلمحة بصر */
        .screen { display: none; }
        .active-screen { display: block; }
        
        h2, h3 { color: #1a365d; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #4a5568; }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
        }
        
        .nav-btn {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .nav-btn:hover { background-color: #2b6cb0; }
        
        /* شريط التقدم التفاعلي */
        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #4a5568;
        }

        .progress-bar-fill { background-color: #3182ce; width: 0%; height: 100%; border-radius: 10px; transition: width 0.4s ease; }
        
        .question-box { font-size: 1.2rem; font-weight: bold; line-height: 1.6; margin-bottom: 20px; color: #1a365d; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-btn {
            background-color: #fff; border: 2px solid #cbd5e0; border-radius: 8px;
            padding: 14px; font-size: 1rem; text-align: right; cursor: pointer; transition: all 0.2s ease;

</head>

            ddlField.options.add(new Option("القدرات العامة", "قدرات"));
            ddlField.options.add(new Option("الاختبار التحصيلي", "تحصيلي"));
            ddlField.options.add(new Option("الاختبار الشامل (القدرات والتحصيلي معاً)", "all"));
        } else if (takhassus === "إسلامية") {
            ddlField.options.add(new Option("الدراسات الإسلامية 1", "إسلامية1"));
            ddlField.options.add(new Option("الدراسات الإسلامية 2", "إسلامية2"));
            ddlField.options.add(new Option("الاختبار الشامل (الإسلامية 1 و 2)", "all"));
        } else if (takhassus === "تربوي") {
            ddlField.options.add(new Option("القيم والمسؤوليات المهنية", "القيم"));
            ddlField.options.add(new Option("المعرفة المهنية", "المعرفة"));
            ddlField.options.add(new Option("الممارسة المهنية", "الممارسة"));
            ddlField.options.add(new Option("المهارات الكمية واللغوية", "الكمية"));
            ddlField.options.add(new Option("الاختبار الشامل (الأقسام الأربعة معاً)", "all"));
        }
    }

    // الانتقال للشاشة الثانية وضمان تعبئة المجالات فوراً
    function goToScreen2() {
        const name = document.getElementById("txtName").value.trim();
        if (name === "") {
            alert("الرجاء كتابة اسمك الكريم أولاً لتسجيل بياناتك.");
            return;
        }
        document.getElementById("screen1").classList.remove("active-screen");
        document.getElementById("screen2").classList.add("active-screen");
        updateFields(); // تعبئة الخيارات لأول مرة تلقائياً
    }

    // 3) دالة تجميع الأسئلة العشوائية وبدء الامتحان (تطابق كود ابدأ والـ On Show المطور)
    function startExamWeb() {
        const takhassus = document.getElementById("ddlTakhassus").value;
        const field = document.getElementById("ddlField").value;
        const countRequest = parseInt(document.getElementById("ddlCount").value);
        
        let pool = [];
        
        // تجميع الأسئلة بناءً على المجال المحدد أو الاختبار الشامل
        if (field === "all") {
            for (let f in allBankQuestions[takhassus]) {
                pool = pool.concat(allBankQuestions[takhassus][f]);
            }
        } else {
            pool = allBankQuestions[takhassus][field] ? [...allBankQuestions[takhassus][field]] : [];
        }
        
        if (pool.length === 0) {
            alert("عذراً، بنك الأسئلة لهذا القسم تحت التحديث حالياً، الرجاء اختيار قسم آخر.");
            return;
        }
        
        // خلط وتوزيع الأسئلة عشوائياً واختيار العدد المطلوب بدقة (منع التكرار)
        pool = pool.sort(() => Math.random() - 0.5);
        selectedQuestions = pool.slice(0, Math.min(countRequest, pool.length));
        
        // تصفير العدادات وبدء التوقيت الصاعد المتناسق مع الجوال
        currentIdx = 0;
        correctAnswersCount = 0;
        wrongAnswersCount = 0;
        startTime = Date.now();
        
        // نقل الطالب لشاشة الاختبار الحية بلمحة بصر
        document.getElementById("screen2").classList.remove("active-screen");
        document.getElementById("screen3").classList.add("active-screen");
        
        showQuestionWeb();
    }
    // 4) دالة عرض وتفصيل السؤال الحالي مع خلط الخيارات (الوميض اللوني)
    function showQuestionWeb() {
        currentQuestion = selectedQuestions[currentIdx];
        
        // إعادة تهيئة الأزرار وتنظيف الألوان السابقة وتفعيل الضغط
        btnIDs.forEach(id => {
            const btn = document.getElementById(id);
            btn.style.visibility = "visible";
            btn.className = "option-btn";
            btn.disabled = false;
        });

        // إعادة تفعيل زر الحذف الخبيث
        document.getElementById("btnEliminate").disabled = false;
        document.getElementById("btnEliminate").style.opacity = "1";

        // تحديث شريط التقدم والعداد بالقمة
        document.getElementById("lblCounter").innerText = `سؤال ${currentIdx + 1} من ${selectedQuestions.length}`;
        document.getElementById("lblScore").innerText = `الصح: ${correctAnswersCount}`;
        let progressPercent = ((currentIdx + 1) / selectedQuestions.length) * 100;
        document.getElementById("progBarFill").style.width = progressPercent + "%";

        // عرض نص السؤال
        document.getElementById("txtQuestion").innerText = currentQuestion.Q;
        
        // إخفاء الصورة مؤقتاً في هذا التحديث (أو شحنها لو كان لها مسار)
        document.getElementById("imgQuestion").style.display = "none";

        let initialAnswers = [
            { txt: currentQuestion.a, key: "A" },
            { txt: currentQuestion.b, key: "B" },
            { txt: currentQuestion.c, key: "C" },
            { txt: currentQuestion.d, key: "D" }
        ];
        
        // خلط الخيارات عشوائياً عدا المفاتيح الأصلية لحمايتها
        mixedAnswers = initialAnswers.sort(() => Math.random() - 0.5);

        document.getElementById("optA").innerText = "أ) " + mixedAnswers[0].txt;
        document.getElementById("optB").innerText = "ب) " + mixedAnswers[1].txt;
        document.getElementById("optC").innerText = "ج) " + mixedAnswers[2].txt;
        document.getElementById("optD").innerText = "د) " + mixedAnswers[3].txt;
    }

    // 5) فحص الإجابة الفلاشي بالألوان والانتقال التلقائي دون نوافذ منبثقة مزعجة
    function checkAnswer(index) {
        let correctAnswerText = currentQuestion[currentQuestion.correct.toLowerCase()];
        
        // قفل الأزرار الأربعة فوراً لمنع التلاعب
        btnIDs.forEach(id => document.getElementById(id).disabled = true);

        let clickedBtnId = btnIDs[index];
        let correctBtnId = "";

        mixedAnswers.forEach((ans, idx) => {
            if (ans.txt === correctAnswerText) { correctBtnId = btnIDs[idx]; }
        });

        if (mixedAnswers[index].txt === correctAnswerText) {
            document.getElementById(clickedBtnId).classList.add("btn-correct");
            correctAnswersCount++;
            document.getElementById("lblScore").innerText = `الصح: ${correctAnswersCount}`;
        } else {
            document.getElementById(clickedBtnId).classList.add("btn-wrong");
            document.getElementById(correctBtnId).classList.add("btn-correct");
            wrongAnswersCount++;
        }

        // انتظار ثانية ونصف لتأمل الإجابة بصرياً ثم الانتقال تلقائياً
        setTimeout(() => {
            if (currentIdx < selectedQuestions.length - 1) {
                currentIdx++;
                showQuestionWeb();
            } else {
                showFinalResults(); // نهاية الاختبار التلقائي
            }
        }, 1200);
    }

    // 6) كود زر حذف إجابتين المتناسق تماماً مع خلط الخيارات
    function eliminateTwoAnswers() {
        const e1 = currentQuestion.elim1;
        const e2 = currentQuestion.elim2;

        mixedAnswers.forEach((ans, idx) => {
            if (ans.key === e1 || ans.key === e2) {
                document.getElementById(btnIDs[idx]).style.visibility = "hidden";
            }
        });
        
        document.getElementById("btnEliminate").disabled = true;
        document.getElementById("btnEliminate").style.opacity = "0.5";
    }

    // 7) دالة إنهاء الاختبار في أي وقت (الخروج المبكر والمنصف)
    function endExamEarly() {
        if (confirm("هل أنت متأكد من إنهاء الاختبار الحالي وعرض التحليل النهائي لمستواك؟")) {
            showFinalResults();
        }
    }

    // 8) حساب النتائج والتحليل النهائي الفوري والمنصف برمجياً
    function showFinalResults() {
        finalTime = Math.floor((Date.now() - startTime) / 1000);
        
        // قراءة المتغيرات وتجهيز الأسئلة التي واجهها وحلها المتدرب بالفعل
        const nameText = document.getElementById("txtName").value;
        const takhassusText = document.getElementById("ddlTakhassus").value;
        const fieldText = document.getElementById("ddlField").options[document.getElementById("ddlField").selectedIndex].text;
        
        let attempted = currentIdx + 1;
        // إذا ضغط إنهاء دون الإجابة على السؤال الحالي، نخصمه من المحاولات
        if (document.getElementById("optA").disabled === false && attempted > 1) {
            attempted = currentIdx;
        }

        // حساب الإجابات الخاطئة الفعلية بناءً على المحاولات لإنصاف المتدرب
        wrongAnswersCount = attempted - correctAnswersCount;

        // حسبة النسبة المئوية الذكية المرنة
        let percent = 0;
        if (attempted > 0) {
            percent = Math.floor((correctAnswersCount / attempted) * 100);
        }

        // التقييم التلقائي
        let evalText = "";
        if (percent >= 90) { evalText = "ممتاز جدًا 🌟"; }
        else if (percent >= 80) { evalText = "ممتاز ✨"; }
        else if (percent >= 70) { evalText = "جيد جدًا 👍"; }
        else if (percent >= 60) { evalText = "جيد (مؤهل للرخصة) 🎯"; }
        else { evalText = "تحتاج مراجعة وتدريب 📚"; }

        // تنسيق الوقت الإجمالي صعوداً بدقة بالدقائق والثواني
        let mins = Math.floor(finalTime / 60);
        let secs = finalTime % 60;
        let timeString = (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);

        // شحن البيانات في شاشة النتائج الرابعة
        document.getElementById("resName").innerText = nameText;
        document.getElementById("resField").innerText = takhassusText + " - " + fieldText;
        document.getElementById("resCorrect").innerText = correctAnswersCount + " سؤال";
        document.getElementById("resWrong").innerText = wrongAnswersCount + " سؤال";
        document.getElementById("resPercent").innerText = percent + "%";
        document.getElementById("resEval").innerText = evalText;
        document.getElementById("resTime").innerText = timeString + " دقيقة";

        // نقل المتدرب لشاشة التحليل النهائي بلمحة بصر
        document.getElementById("screen3").classList.remove("active-screen");
        document.getElementById("screen4").classList.add("active-screen");
    }

    // 9) زر إعادة الاختبار وتصفير العدادات والرجوع لشاشة الخيارات
    function resetAndRestart() {
        document.getElementById("screen4").classList.remove("active-screen");
        document.getElementById("screen2").classList.add("active-screen");
    }

    // أزرار الرسائل المنبثقة المحفوظة للمساعدات التربوية
    function showHint() { alert("💡 تلميح بسيط لمساعدتك:\n\n" + currentQuestion.hint_simple); }
    function showKey() { alert("🔑 الكلمة المفتاحية للحل:\n\n" + currentQuestion.hint_key); }
    function showStandard() { alert("📊 تصنيف هذا السؤال في قياس:\n\n" + currentQuestion.hint_standard); }
</script>
