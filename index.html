<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة asiltrain - محاكي الاختبارات</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f6f7; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        .btn-submit { background-color: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #219653; }
        .alert { background-color: #fadbd8; color: #78281f; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; text-align: right; font-size: 14px; }
        .hint { font-size: 13px; color: #7f8c8d; margin-top: 20px; line-height: 1.5; }
        
        /* تصميم الرابط الإغراقي الجديد المضاف للأسفل بطلبك */
        .register-link-box { margin-top: 18px; border-top: 1px dashed #cbd5e0; padding-top: 15px; font-size: 14px; }
        .register-link-box a { color: #2980b9; font-weight: bold; text-decoration: none; }
        .register-link-box a:hover { text-decoration: underline; color: #1a5276; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>منصة محاكي الاختبارات الذكي</h2>
    <div id="errorMsg" class="alert"></div>
    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>اسم المتدرب / المتدربة:</label>
            <input type="text" id="studentName" required placeholder="أدخل اسمك الثلاثي">
        </div>
        <div class="form-group">
            <label>كود التفعيل أو الرمز السري:</label>
            <input type="password" id="activationCode" required placeholder="أدخل كود التفعيل">
        </div>
        <div class="form-group">
            <label>اختر التخصص المطلوب:</label>
            <select id="examField" required>
                <option value="">-- اختر القسم الحالي --</option>
                <option value="tarbawi">الرخصة المهنية - العام (التربوي)</option>
                <option value="trainers">الرخصة المهنية - المدربين</option>
                <option value="computer">الرخصة المهنية - حاسب آلي</option>
                <option value="islamic">الرخصة المهنية - دراسات إسلامية</option>
                <option value="arabic">الرخصة المهنية - لغة عربية</option>
                <option value="math">الرخصة المهنية - رياضيات</option>
                <option value="science">الرخصة المهنية - علوم</option>
                <option value="ejtemaeyat">الرخصة المهنية - اجتماعيات</option>
                <option value="sport">الرخصة المهنية - تربية بدنية (رياضة)</option>
                <option value="art">الرخصة المهنية - تربية فنية</option>
                <option value="qodrat_tahsili">مسار الثانوي - القدرات والتحصيلي</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">دخول المحاكي وبدء الاختبار</button>
    </form>
    <p class="hint">💡 <b>للتجربة (10 أسئلة):</b> الاسم: <b>guest</b> والرمز: <b>1234</b></p>
    
    <!-- الرابط المضاف للحصول على الكود الفول الفاخر -->
    <div class="register-link-box">
        🔑 ليس لديك كود؟ <a href="subscribe.html">للحصول على كود التفعيل الكامل وإرسال إيصال السداد اضغط هنا</a>
    </div>
</div>
<script>
function handleLogin(event) {
    event.preventDefault();
    const name = document.getElementById('studentName').value.trim();
    const code = document.getElementById('activationCode').value.trim().toUpperCase();
    const field = document.getElementById('examField').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (name.toLowerCase() === 'guest' && code === '1234') {
        saveAndRedirect(name, field, 'guest');
        return;
    }

    const codePrefixes = {
        'tarbawi': 'TAR', 'trainers': 'TRN', 'computer': 'COM', 'islamic': 'ISL', 
        'arabic': 'ARA', 'math': 'MAT', 'science': 'SCI', 'ejtemaeyat': 'SOC', 
        'sport': 'SPO', 'art': 'ART', 'qodrat_tahsili': 'SEC'
    };

    const expectedPrefix = codePrefixes[field];
    const parts = code.split('-'); 
    let isValid = false;
    const CRYPTO_SALT = 743;

    if (parts.length === 3 && parts[0] === expectedPrefix) {
        const randomNum = parseInt(parts[1]);
        const checkDigit = parseInt(parts[2]);
        
        if (!isNaN(randomNum) && !isNaN(checkDigit) && (randomNum + CRYPTO_SALT) % 9 === checkDigit) {
            isValid = true;
        }
    }

    if (isValid) {
        saveAndRedirect(name, field, 'member');
    } else {
        errorMsg.textContent = `❌ كود التفعيل غير صحيح أو لا يطابق التخصص المختار! تأكد من الكود المخصص لـ (${expectedPrefix})`;
        errorMsg.style.display = 'block';
    }
}

function saveAndRedirect(name, field, role) {
    localStorage.clear();
    localStorage.setItem('activeUser', name);
    localStorage.setItem('userRole', role);
    window.location.href = field + '.html';
}
</script>
</body>
</html>
