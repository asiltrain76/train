<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السرية - منصة asiltrain</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #2980b9; 
            --success: #27ae60; 
            --danger: #e74c3c;
            --bg: #ecf0f1; 
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .admin-box { max-width: 700px; background: white; margin: 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; }
        h2 { color: var(--primary); border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; margin-top: 10px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input, select { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px; }
        .btn:hover { background: #2471a3; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #1e8449; }
        .btn-logout { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; position: absolute; top: 30px; left: 30px; transition: 0.2s; }
        .btn-logout:hover { background: #c0392b; }
        .result-box { margin-top: 25px; display: none; text-align: right; }
        textarea { width: 100%; height: 200px; font-family: monospace; font-size: 15px; padding: 10px; border: 2px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; background: #f8f9fa; direction: ltr; text-align: left; }
        .hidden { display: none; }
        .lock-screen { max-width: 400px; background: white; margin: 80px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>

<!-- شاشة الحماية البرمجية لمنع المتطفلين -->
<div id="lockScreen" class="lock-screen">
    <h3 style="color: var(--primary); margin-bottom: 20px;">قفل الأمان للمنصة 🔒</h3>
    <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="adminUser" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
        <label>الرقم السري للمطور (أبو إبراهيم):</label>
        <input type="password" id="adminPass" placeholder="••••••••">
    </div>
    <button class="btn" onclick="checkAdminPass()">فتح لوحة التحكم</button>
</div>

<!-- لوحة التحكم الفعلية (تفتح للمسجلين وتثبت ضد الـ Refresh) -->
<div id="adminPanel" class="admin-box hidden">
    <!-- زر تسجيل الخروج الآمن المطور -->
    <button class="btn-logout" onclick="adminLogout()">🚪 خروج آمن</button>

<!-- صندوق إحصائيات الزوار المطور والمضمون 100% (مريح للعين) -->
<div style="background-color: #ffffff; padding: 18px; border-radius: 10px; margin-bottom: 25px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 2px solid #e2e8f0;">
    <h4 style="margin: 0 0 12px 0; color: #2c3e50; font-size: 1rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;">
        📊 إحصائيات زوار منصة asiltrain الحية (سري)
    </h4>
    <!-- العداد الجديد المستقر والمحدث تلقائياً لزيارات مشروعك الفعلي -->
    <img src="https://seeyoufarm.com" alt="عداد الزوار الفعلي" style="border-radius: 4px; max-width: 100%; display: inline-block; margin-top: 5px;">
</div>


    <h2>مولد أكواد التفعيل والاشتراكات الذكي 🚀</h2>
    <p style="color: #7f8c8d; font-size: 14px;">حدد التخصص والعدد لتوليد أكواد مشفرة تتوافق مع نظام المنصة الحية تلقائياً.</p>
    <div class="form-group">
        <label>اختر التخصص المطلوب توليد أكواد له:</label>
        <select id="targetField">
            <option value="TAR">الرخصة المهنية - العام (التربوي)</option>
            <option value="TRN">الرخصة المهنية - المدربين</option>
            <option value="COM">الرخصة المهنية - حاسب آلي</option>
            <option value="ISL">الرخصة المهنية - دراسات إسلامية</option>
            <option value="ARA">الرخصة المهنية - لغة عربية</option>
            <option value="MAT">الرخصة المهنية - رياضيات</option>
            <option value="SCI">الرخصة المهنية - علوم</option>
            <option value="SOC">الرخصة المهنية - اجتماعيات</option>
            <option value="SPO">الرخصة المهنية - تربية بدنية (رياضة)</option>
            <option value="ART">الرخصة المهنية - تربية فنية</option>
            <option value="SEC">مسار الثانوي - القدرات والتحصيلي</option>
        </select>
    </div>

    <div class="form-group">
        <label>عدد الأكواد المطلوبة (مثلاً: 50 أو 100):</label>
        <input type="number" id="codesCount" value="50" min="1" max="500">
    </div>

    <button class="btn" onclick="generateSecureCodes()">توليد الأكواد المشفرة الآن</button>

    <!-- منطقة النتائج والتصدير للمفكرة -->
    <div id="resultArea" class="result-box">
        <label>الأكواد الجاهزة (قم بنسخها أو تحميلها مباشرة):</label>
        <textarea id="codesOutput" readonly></textarea>
        <button class="btn btn-success" onclick="downloadTxtFile()">📥 تحميل الأكواد في ملف مفكرة (.txt)</button>
    </div>
</div>

<script>
// بيانات الدخول المعتمدة والسرية الخاصة بك
const EXPECTED_USER = 'asiltrain76';
const EXPECTED_PASS = 'I1396#z1398'; 

// مفتاح خوارزمية التشفير الرياضية اللحظية المتوافقة مع صفحة الدخول
const CRYPTO_SALT = 743; 

// نظام الفحص التلقائي للحفاظ على تسجيل الدخول ومنع الطرد عند التحديث
window.onload = function() {
    const isLogin = localStorage.getItem('adminLoggedIn');
    if (isLogin === 'true') {
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
    }
};
function checkAdminPass() {
    const enteredUser = document.getElementById('adminUser').value.trim();
    const enteredPass = document.getElementById('adminPass').value;

    if (enteredUser === EXPECTED_USER && enteredPass === EXPECTED_PASS) {
        // حفظ حالة الدخول بثبات داخل ذاكرة المتصفح
        localStorage.setItem('adminLoggedIn', 'true');
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
    } else {
        alert("❌ اسم المستخدم أو الرقم السري غير صحيح! الوصول مرفوض.");
    }
}

// دالة تسجيل الخروج لتنظيف الذاكرة وقفل اللوحة مجدداً عند الرغبة
function adminLogout() {
    if(confirm("هل تريد تسجيل الخروج وإغلاق لوحة التحكم؟")) {
        localStorage.removeItem('adminLoggedIn');
        window.location.reload();
    }
}

// دالة توليد الأكواد بالمعادلة الشفرية الذكية
function generateSecureCodes() {
    const prefix = document.getElementById('targetField').value;
    const count = parseInt(document.getElementById('codesCount').value);
    let outputText = `--- قائمة أكواد تفعيل تخصص (${prefix}) ---\n`;
    
    for (let i = 0; i < count; i++) {
        const randomNum = Math.floor(10000 + Math.random() * 90000);
        const checkDigit = (randomNum + CRYPTO_SALT) % 9;
        const finalCode = `${prefix}-${randomNum}-${checkDigit}`;
        outputText += finalCode + "\n";
    }
    
    document.getElementById('codesOutput').value = outputText;
    document.getElementById('resultArea').style.display = 'block';
}

// دالة تحميل الملف تلقائياً وبأسم التخصص والتاريخ اللحظي للمفكرة
function downloadTxtFile() {
    const prefix = document.getElementById('targetField').value;
    const text = document.getElementById('codesOutput').value;
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `اشتراكات_${prefix}_${new Date().toLocaleDateString('en-US')}.txt`;
    link.click();
}
</script>

</body>
</html>
