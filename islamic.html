<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الاختبارات المطور - تخصص الدراسات الإسلامية</title>
    <style>
        :root { 
            --primary: #2b6cb0; 
            --success: #38a169; 
            --danger: #e53e3e; 
            --bg: #f7fafc; 
            --accent: #8e44ad;
            --warning: #dd6b20;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; user-select: none; }
        .container { max-width: 650px; background: white; margin: 20px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .progress-bar { width: 100%; background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 15px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .meta-info { display: flex; justify-content: space-between; font-size: 0.95rem; color: #4a5568; font-weight: bold; margin-bottom: 15px; }
        .help-panel { display: flex; justify-content: space-around; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #cbd5e0; }
        .help-btn { background: none; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; color: #4a5568; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .help-btn:hover { color: var(--primary); transform: scale(1.05); }
        .help-btn:disabled { color: #cbd5e0; cursor: not-allowed; transform: none; opacity: 0.5; }
        .popup-info { background: #fffaf0; border: 1px solid #feebc8; color: #c05621; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 500; margin-bottom: 15px; text-align: right; display: none; }
        .question-card { font-size: 1.25rem; font-weight: bold; margin-bottom: 25px; padding: 18px; border-right: 6px solid var(--primary); background: #ebf8ff; text-align: right; line-height: 1.6; }
        .btn-opt { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; font-size: 1.05rem; font-weight: 500; cursor: pointer; text-align: right; transition: all 0.2s; }
function shareResult() {
    const solvedCount = Math.min(currentIndex, maxQuestions);
    const pct = solvedCount > 0 ? ((correctCount / solvedCount) * 100).toFixed(1) : 0;
    
    // النص اللي بينسخ للحافظة بدون فتح أي روابط خارجية
    const textToCopy = `الحمد لله! حصلت على نسبة ${pct}% في محاكي اختبار الرخصة المهنية للدراسات الإسلامية عبر منصة تراك التعليمية 🎯✨`;
    
    // أمر النسخ البرمي المباشر للحافظة
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("✅ تم نسخ النتيجة بنجاح! يمكنك الآن لصقها ومشاركتها في أي مكان تريد.");
    }).catch(err => {
        alert("⚠️ عذراً، تعذر النسخ التلقائي. يمكنك نسخ النص يدوياً.");
    });
}
function loadQuestion() {
    document.getElementById('hint-box').style.display = 'none';
    document.getElementById('standard-box').style.display = 'none';
    document.getElementById('elim-btn').disabled = false;

    // 🔄 فحص التخطي الذكي: إذا وصلنا لنهاية الأسئلة وهناك أسئلة متخطاة، نفتح الجولة الثانية لمراجعتها
    if (currentIndex >= maxQuestions) { 
        if (skippedQuestions.length > 0) {
            // سحب أول سؤال تم تخطيه من مصفوفة التتبع لعرضه بالدور
            currentIndex = skippedQuestions.shift();
            // إخفاء زر التخطي في جولة المراجعة الأخيرة لكي لا يدخل في حلقة مفرغة
            document.getElementById('skip-btn').style.display = 'none';
            alert("🔄 جولة المراجعة: سيتم الآن عرض الأسئلة التي قمت بتخطيتها وتأجيلها سابقاً لحلها بالترتيب.");
        } else {
            if (isGuest) alert("انتهت الجولة التجريبية المشوقة المكونة من 20 سؤالاً! يرجى الاشتراك الكامل لفتح بنك الأسئلة بالكامل وتأمين رخصتك المهنية."); 
            showResults(); 
            return; 
        }
    }

    // 🛡️ تكتيك الحفظ اللحظي الكامل للمشتركين قبل عرض السؤال الجديد
    if (!isGuest) {
        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        localStorage.setItem(`asiltrain_autosave_idx_${currentFieldKey}`, currentIndex); 
        localStorage.setItem(`asiltrain_autosave_score_${currentFieldKey}`, correctCount);
        localStorage.setItem(`asiltrain_autosave_time_${currentFieldKey}`, elapsedTime);
        localStorage.setItem(`asiltrain_autosave_skips_${currentFieldKey}`, skippedQuestions.join(','));
    } else {
        localStorage.setItem('isl_idx', currentIndex); 
        localStorage.setItem('isl_score', correctCount);
    }

    const qData = questions[currentIndex];
    
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${qData.question}`;
    document.getElementById('hint-box').innerText = `💡 تلميح ومفتاح الحل: ${qData.simple_hint || 'تأمل النص الشرعي أو الفقهي جيداً.'}`;
    document.getElementById('standard-box').innerText = `🎯 الرابط والخصائص المهنية: ${qData.standard_hint || 'المعيار والمؤشر التخصصي المعتمد.'}`;

    const originalCorrectText = qData.options[qData.correct.toLowerCase()];
    const originalElim1Text = qData.options[qData.elim1.toLowerCase()];
    const originalElim2Text = qData.options[qData.elim2.toLowerCase()];

    let optArray = [
        { text: qData.options.a, isCorrect: qData.options.a === originalCorrectText, isElim1: qData.options.a === originalElim1Text, isElim2: qData.options.a === originalElim2Text },
        { text: qData.options.b, isCorrect: qData.options.b === originalCorrectText, isElim1: qData.options.b === originalElim1Text, isElim2: qData.options.b === originalElim2Text },
        { text: qData.options.c, isCorrect: qData.options.c === originalCorrectText, isElim1: qData.options.c === originalElim1Text, isElim2: qData.options.c === originalElim2Text },
        { text: qData.options.d, isCorrect: qData.options.d === originalCorrectText, isElim1: qData.options.d === originalElim1Text, isElim2: qData.options.d === originalElim2Text }
    ];

    // لضمان استقرار الخيارات وثباتها عند العودة بعد قفل الصفحة أو التحديث
    let seed = currentIndex;
    optArray.sort(() => {
        seed = (seed * 9301 + 49297) % 233280;
        return (seed / 233280) - 0.5;
    });

    const targetLetters = ['A', 'B', 'C', 'D'];
    optArray.forEach((item, index) => {
        const letter = targetLetters[index];
        const b = document.getElementById(`opt${letter}`);
        b.innerText = item.text || "---";
        b.className = "btn-opt";
        b.disabled = false;

        if (item.isCorrect) currentCorrectLetter = letter;
        if (item.isElim1) currentElim1Letter = letter;
        if (item.isElim2) currentElim2Letter = letter;
    });

    document.getElementById('progress').style.width = `${(currentIndex / maxQuestions) * 100}%`;
}

// 🔄 دالة التخطي وتأجيل السؤال للمراجعة اللاحقة في نهاية الاختبار
function skipQuestion() {
    if (!skippedQuestions.includes(currentIndex)) {
        skippedQuestions.push(currentIndex);
    }
    currentIndex++;
    loadQuestion();
}

function togglePopup(type) {
    const box = document.getElementById(`${type}-box`);
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
}

function checkAnswer(sel) {
    const corr = currentCorrectLetter;
    
    ['A', 'B', 'C', 'D'].forEach(opt => document.getElementById(`opt${opt}`).disabled = true);
    
    if (sel === corr) { 
        document.getElementById(`opt${sel}`).classList.add('correct'); correctCount++; 
        document.getElementById('score-info').innerText = `✅ الصح: ${correctCount}`; 
    } else { 
        document.getElementById(`opt${sel}`).classList.add('wrong'); 
        document.getElementById(`opt${corr}`).classList.add('correct'); 
    }

    if (isGuest) {
        let persistentCounter = parseInt(localStorage.getItem(`asiltrain_guest_counter_${currentFieldKey}`) || '0');
        persistentCounter++;
        localStorage.setItem(`asiltrain_guest_counter_${currentFieldKey}`, persistentCounter);

        if (persistentCounter >= 20) {
            setTimeout(() => { window.location.href = "index.html"; }, 1200);
            return;
        }
    }

    setTimeout(() => { currentIndex++; loadQuestion(); }, 1200);
}

function eliminateTwo() {
    document.getElementById('elim-btn').disabled = true;
    if(currentElim1Letter) document.getElementById(`opt${currentElim1Letter}`).innerText = "---";
    if(currentElim2Letter) document.getElementById(`opt${currentElim2Letter}`).innerText = "---";
}

function showResults() {
    clearInterval(timerInterval);
    document.getElementById('exam-container').classList.add('hidden');
    document.getElementById('result-container').classList.remove('hidden');
    
    const solvedCount = Math.min(currentIndex, maxQuestions);
    const pct = solvedCount > 0 ? ((correctCount / solvedCount) * 100).toFixed(1) : 0;
    const rank = getRankText(parseFloat(pct));
    const diff = Math.floor((Date.now() - startTime) / 1000);

    // 📊 هندسة لوحة التحليل المرئية الملونة ديناميكياً بناءً على النسبة المحققة
    const bar = document.getElementById('analytics-bar');
    if (bar) {
        bar.style.width = `${pct}%`;
        if (pct >= 80) {
            bar.className = "analytics-bar-fill bar-success";
        } else if (pct >= 50) {
            bar.className = "analytics-bar-fill bar-warning";
        } else {
            bar.className = "analytics-bar-fill bar-danger";
        }
    }

    document.getElementById('final-name').innerText = `👤 اسم المتدرب الكريم: ${localStorage.getItem('activeUser')}`;
    document.getElementById('final-score').innerHTML = `🎯 النتيجة للتحليل اللحظي: حققت <span style='color:var(--success); font-weight:bold;'>${correctCount}</span> إجابة صحيحة موثقة من أصل <b>${solvedCount}</b> سؤالاً تم استهدافها بمحاكاتك.<br>📊 النسبة والتقدير التدريبي المهني الموثق: <b>${pct}%</b> - <span style='color:var(--primary); font-weight:bold;'>${rank}</span>`;
    document.getElementById('final-time').innerText = `⏱️ إجمالي الوقت المستغرق في المحاكاة الحية: ${Math.floor(diff / 60)} دقيقة و ${diff % 60} ثانية`;
    
    // تنظيف مفاتيح التتبع اللحظية للـ Auto-Save فور اكتمال الجولة ونجاح التصحيح الكلي للمشترك
    localStorage.removeItem(`asiltrain_autosave_idx_${currentFieldKey}`);
    localStorage.removeItem(`asiltrain_autosave_score_${currentFieldKey}`);
    localStorage.removeItem(`asiltrain_autosave_time_${currentFieldKey}`);
    localStorage.removeItem(`asiltrain_autosave_skips_${currentFieldKey}`);
    localStorage.removeItem('isl_idx'); 
    localStorage.removeItem('isl_score');
}

// دالة مشاركة النتيجة المحدثة بدون روابط خارجية (منطق النسخ والتنبيه الأصلي الموثوق)
function shareResult() {
    const solvedCount = Math.min(currentIndex, maxQuestions);
    const pct = solvedCount > 0 ? ((correctCount / solvedCount) * 100).toFixed(1) : 0;
    const textToCopy = `الحمد لله! حصلت على نسبة ${pct}% في محاكي اختبار الرخصة المهنية للدراسات الإسلامية عبر منصة تراك التعليمية 🎯✨`;
    
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("✅ تم نسخ النتيجة بنجاح! يمكنك الآن لصقها ومشاركتها في أي مكان تريد.");
    }).catch(err => {
        alert("⚠️ عذراً، تعذر النسخ التلقائي. يمكنك نسخ النص يدوياً.");
    });
}

function endExamEarly() { 
    if(confirm("هل أنت متأكد من إنهاء المحاكاة مبكراً ومراجعة النتيجة للأسئلة الحالية؟")) showResults(); 
}
function exitToMain() { 
    window.location.href = "index.html"; 
}
</script>

<!-- 🎯 ربط ملف بنك أسئلة الدراسات الإسلامية المولد من الـ Node.js تلقائياً -->
<script src="qislam.js"></script>

</body>
</html>
